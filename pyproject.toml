[project]
name = "ws26_industrial_datascience_manuscript"
version = "0.1.0"
description = "Industrial Data Science Manuscript"
authors = [
    { name = "Gregor Ehrensperger", email = "g@ehrensperger.dev" },
]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { text = "-" }
dependencies = [
    "quarto-cli>=1.10.18",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sktime>=1.1.0",
    "statsmodels>=0.15.0",
    "tensorflow>=2.21.0",
    "torch>=2.14.0",
    "tslearn>=0.9.0",
    "yfinance>=1.7.0",
]
